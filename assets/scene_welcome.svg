<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70C8FF"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="320" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="340" cy="50" r="32" fill="#FDE047" opacity="0.9"/>
  <circle cx="340" cy="50" r="44" fill="#FEF08A" opacity="0.4"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.92">
    <ellipse cx="70" cy="45" rx="35" ry="18"/>
    <ellipse cx="95" cy="38" rx="25" ry="16"/>
    <ellipse cx="50" cy="48" rx="20" ry="12"/>

    <ellipse cx="260" cy="65" rx="40" ry="20"/>
    <ellipse cx="290" cy="58" rx="28" ry="18"/>
    <ellipse cx="235" cy="68" rx="22" ry="14"/>
  </g>

  <!-- Distant Mountains -->
  <path d="M-20 200 L60 120 L160 210 Z" fill="#93C5FD" opacity="0.6"/>
  <path d="M120 210 L210 130 L300 210 Z" fill="#60A5FA" opacity="0.5"/>

  <!-- Blue Lake -->
  <ellipse cx="100" cy="205" rx="90" ry="22" fill="url(#lakeGrad)"/>

  <!-- Background Hills -->
  <path d="M-20 230 Q90 160 220 220 T420 210 L420 320 L-20 320 Z" fill="url(#hill2)"/>

  <!-- Foreground Green Hills -->
  <path d="M-20 260 Q120 190 280 250 T420 240 L420 320 L-20 320 Z" fill="url(#hill1)"/>

  <!-- Red Roof Schoolhouse -->
  <g transform="translate(260, 160)">
    <!-- Main building wall -->
    <rect x="0" y="25" width="90" height="55" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <!-- Roof -->
    <polygon points="-8,25 45,-10 98,25" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
    <!-- Bell tower -->
    <rect x="35" y="-30" width="20" height="20" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <polygon points="30,-30 45,-45 60,-30" fill="#DC2626"/>
    <circle cx="45" cy="-20" r="4" fill="#F59E0B"/>
    <!-- Door -->
    <rect x="36" y="50" width="18" height="30" rx="2" fill="#78350F"/>
    <circle cx="50" cy="65" r="2" fill="#FDE047"/>
    <!-- Windows -->
    <rect x="12" y="36" width="16" height="18" rx="2" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect x="62" y="36" width="16" height="18" rx="2" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.5"/>
    <!-- Clock -->
    <circle cx="45" cy="12" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <line x1="45" y1="12" x2="45" y2="8" stroke="#1E1B4B" stroke-width="1.5"/>
    <line x1="45" y1="12" x2="48" y2="12" stroke="#1E1B4B" stroke-width="1.5"/>
  </g>

  <!-- Trees around school -->
  <g fill="#15803D">
    <ellipse cx="250" cy="220" rx="14" ry="24"/>
    <rect x="247" y="235" width="6" height="15" fill="#78350F"/>
    <ellipse cx="365" cy="225" rx="18" ry="26"/>
    <rect x="362" y="240" width="7" height="15" fill="#78350F"/>
    <ellipse cx="385" cy="235" rx="14" ry="20"/>
  </g>

  <!-- Winding Country Path -->
  <path d="M80 320 C100 280, 160 270, 140 240 C125 215, 170 205, 270 215" 
        fill="none" stroke="url(#roadGrad)" stroke-width="42" stroke-linecap="round"/>
  <path d="M80 320 C100 280, 160 270, 140 240 C125 215, 170 205, 270 215" 
        fill="none" stroke="#FEF08A" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>
</svg>