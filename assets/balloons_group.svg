<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <defs>
    <linearGradient id="balloonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1D4ED8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 4 Groups of 3 blue balloons (3 x 4 = 12) -->
  <!-- Group 1 -->
  <g transform="translate(10, 0)" filter="url(#bShadow)">
    <circle cx="20" cy="45" r="16" fill="url(#balloonGrad)"/>
    <circle cx="16" cy="40" r="4" fill="#BFDBFE"/>
    <circle cx="45" cy="30" r="16" fill="url(#balloonGrad)"/>
    <circle cx="41" cy="25" r="4" fill="#BFDBFE"/>
    <circle cx="55" cy="55" r="16" fill="url(#balloonGrad)"/>
    <circle cx="51" cy="50" r="4" fill="#BFDBFE"/>
    <text x="38" y="86" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="middle">3'lü</text>
  </g>

  <!-- Group 2 -->
  <g transform="translate(95, 0)" filter="url(#bShadow)">
    <circle cx="20" cy="45" r="16" fill="url(#balloonGrad)"/>
    <circle cx="16" cy="40" r="4" fill="#BFDBFE"/>
    <circle cx="45" cy="30" r="16" fill="url(#balloonGrad)"/>
    <circle cx="41" cy="25" r="4" fill="#BFDBFE"/>
    <circle cx="55" cy="55" r="16" fill="url(#balloonGrad)"/>
    <circle cx="51" cy="50" r="4" fill="#BFDBFE"/>
    <text x="38" y="86" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="middle">3'lü</text>
  </g>

  <!-- Group 3 -->
  <g transform="translate(180, 0)" filter="url(#bShadow)">
    <circle cx="20" cy="45" r="16" fill="url(#balloonGrad)"/>
    <circle cx="16" cy="40" r="4" fill="#BFDBFE"/>
    <circle cx="45" cy="30" r="16" fill="url(#balloonGrad)"/>
    <circle cx="41" cy="25" r="4" fill="#BFDBFE"/>
    <circle cx="55" cy="55" r="16" fill="url(#balloonGrad)"/>
    <circle cx="51" cy="50" r="4" fill="#BFDBFE"/>
    <text x="38" y="86" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="middle">3'lü</text>
  </g>

  <!-- Group 4 -->
  <g transform="translate(265, 0)" filter="url(#bShadow)">
    <circle cx="20" cy="45" r="16" fill="url(#balloonGrad)"/>
    <circle cx="16" cy="40" r="4" fill="#BFDBFE"/>
    <circle cx="45" cy="30" r="16" fill="url(#balloonGrad)"/>
    <circle cx="41" cy="25" r="4" fill="#BFDBFE"/>
    <circle cx="55" cy="55" r="16" fill="url(#balloonGrad)"/>
    <circle cx="51" cy="50" r="4" fill="#BFDBFE"/>
    <text x="38" y="86" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="middle">3'lü</text>
  </g>
</svg>