<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Star Mascot in Clouds with Confetti -->
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Confetti Pieces -->
  <rect x="30" y="20" width="10" height="6" rx="2" fill="#EF4444" transform="rotate(25 30 20)"/>
  <circle cx="60" cy="35" r="4" fill="#3B82F6"/>
  <rect x="200" y="30" width="12" height="6" rx="2" fill="#10B981" transform="rotate(-30 200 30)"/>
  <circle cx="185" cy="55" r="5" fill="#EC4899"/>
  <polygon points="120,5 123,12 130,12 125,16 127,23 120,19 113,23 115,16 110,12 117,12" fill="#F59E0B"/>
  <rect x="40" y="70" width="8" height="5" rx="1.5" fill="#8B5CF6" transform="rotate(45 40 70)"/>
  <rect x="195" y="80" width="10" height="6" rx="2" fill="#F59E0B" transform="rotate(15 195 80)"/>

  <!-- Backpack behind mascot -->
  <rect x="68" y="75" width="104" height="60" rx="18" fill="#1D4ED8"/>

  <!-- 3D Star Body -->
  <g filter="url(#glow)">
    <path d="M120 25 
             L136 68 
             L182 72 
             L146 102 
             L157 146 
             L120 122 
             L83 146 
             L94 102 
             L58 72 
             L104 68 Z" 
          fill="url(#starGrad)" stroke="#B45309" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Face details -->
  <!-- Big Cute Anime Eyes -->
  <ellipse cx="106" cy="85" rx="7" ry="10" fill="#1E1B4B"/>
  <circle cx="104" cy="81" r="3.5" fill="#FFFFFF"/>
  <circle cx="108" cy="89" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="134" cy="85" rx="7" ry="10" fill="#1E1B4B"/>
  <circle cx="132" cy="81" r="3.5" fill="#FFFFFF"/>
  <circle cx="136" cy="89" r="1.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="94" cy="95" rx="7" ry="4" fill="#F87171" opacity="0.7"/>
  <ellipse cx="146" cy="95" rx="7" ry="4" fill="#F87171" opacity="0.7"/>

  <!-- Joyful Smile -->
  <path d="M112 96 Q120 108 128 96" fill="#991B1B" stroke="#7F1D1D" stroke-width="2"/>

  <!-- Arms waving -->
  <ellipse cx="70" cy="86" rx="10" ry="16" fill="#F59E0B" transform="rotate(-35 70 86)"/>
  <ellipse cx="170" cy="86" rx="10" ry="16" fill="#F59E0B" transform="rotate(35 170 86)"/>

  <!-- Fluffy White Clouds in Front -->
  <g fill="#FFFFFF" opacity="0.98">
    <ellipse cx="60" cy="165" rx="45" ry="32"/>
    <ellipse cx="120" cy="155" rx="60" ry="40"/>
    <ellipse cx="180" cy="165" rx="45" ry="32"/>
    <ellipse cx="90" cy="175" rx="40" ry="25"/>
    <ellipse cx="150" cy="175" rx="40" ry="25"/>
  </g>
</svg>